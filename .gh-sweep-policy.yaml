# gh-sweep's own policy baseline. Self-hosted: this repo declares a target
# state for itself and checks its live settings against it on every push.
# See .gh-sweep-policy.yaml.example for the full field reference, and
# .github/workflows/policy-check.yml for how this file is consumed.
#
# Check-only for now: nothing in CI applies this file. Widening to an apply
# job (policy-apply.yml, gated by a GitHub Environment) is a separate call,
# tracked in ROADMAP.md.

repositories:
  - KyleKing/gh-sweep

settings:
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: false

security:
  secret_scanning: enabled
  secret_scanning_push_protection: enabled

protection:
  required_reviews: 1
  require_code_owner_reviews: false
  require_status_checks:
    - ci
  enforce_admins: false
  require_linear_history: false
  allow_force_pushes: false
  allow_deletions: false

# gh-sweep's own policy baseline. Self-hosted: this repo declares a target
# state for itself and checks its live settings against it on every push.
# See .gh-sweep-policy.yaml.example for the full field reference, and
# .github/workflows/policy-check.yml for how this file is consumed.
#
# .github/workflows/policy.yml applies this file on demand, behind the
# policy-apply environment's approval gate.
#
# There is deliberately no `protection:` block. Declaring one here would set
# required_reviews and require_status_checks on main, which blocks the direct
# pushes this repo's workflow depends on. Add it only alongside a move to a
# PR-based workflow.

repositories:
  - KyleKing/gh-sweep

settings:
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: false

security:
  secret_scanning: enabled
  secret_scanning_push_protection: enabled

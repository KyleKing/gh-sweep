# Project-specific tasks for gh-sweep
# Generic tasks are in template.toml (managed by copier template).
# mise loads conf.d/*.toml alphabetically and last definition wins, so this file
# must sort after template.toml for the `ci` override below to take effect.

[tasks.ci]
description = "Run all checks (used in GitHub Actions)"
run = [
  "go test -v -coverprofile=coverage.out -coverpkg=./... ./...",
  '''
  coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
  echo "Current coverage: ${coverage}%"
  if (( $(awk "BEGIN {print ($coverage < 70)}") )); then
      echo "Coverage ${coverage}% is below 70% minimum threshold"
      exit 1
  fi
  ''',
  "./scripts/check-test-safety.sh",
  "go test -tags=golden -run TestGolden ./internal/tui/...",
  "go build -v -o gh-sweep ./cmd/gh-sweep",
]

[tasks."test:golden"]
description = "Run golden snapshot tests"
run = "go test -tags=golden -run TestGolden ./internal/tui/..."

[tasks."test:golden-update"]
description = "Regenerate golden snapshots"
run = "go test -tags=golden -run TestGolden ./internal/tui/... -update"

[tasks."test:safety"]
description = "Check tests for un-faked GitHub client construction"
run = "./scripts/check-test-safety.sh"

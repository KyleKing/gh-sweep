# Shared tasks are in .config/mise/conf.d/template.toml (managed by copier template)
# Project-specific tasks belong in additional .config/mise/conf.d/*.toml files (always loaded)

[settings]
experimental = true

[tools]
actionlint = "latest"
go = "latest"
"go:github.com/golangci/golines" = "latest"
"golangci-lint" = "2.8.0"
hk = "1.32.0"
ls-lint = "latest"
"pipx:commitizen" = "latest"
"pipx:pre-commit-hooks" = "latest"
"pipx:toml-sort" = "latest"

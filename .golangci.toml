# Configuration file for golangci-lint
# For more options, see https://golangci-lint.run/usage/configuration/

version = "2"

[formatters]
enable = ["gci", "gofmt", "gofumpt", "goimports"]

[formatters.settings.gci]
sections = ["standard", "default", "prefix(github.com/KyleKing/gh-sweep)"]

[formatters.settings.gofumpt]
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ["github.com/KyleKing/gh-sweep"]

[linters]
disable = [
  "depguard",  # requires allowlist/denylist configuration
  "forbidigo",  # requires custom regex configuration
  "gochecknoglobals",  # BubbleTea/lipgloss styles use package-level vars
  "goheader",  # copyright headers add noise for personal projects
  "wsl",  # whitespace linting too nitpicky
]
enable = [
  "asciicheck",
  "bidichk",
  "bodyclose",
  "containedctx",
  "contextcheck",
  "copyloopvar",
  "cyclop",
  "decorder",
  "dogsled",
  "dupl",
  "dupword",
  "durationcheck",
  "err113",
  "errcheck",
  "errchkjson",
  "errname",
  "errorlint",
  "exhaustive",
  "fatcontext",
  "forcetypeassert",
  "funlen",
  "ginkgolinter",
  "gocheckcompilerdirectives",
  "gochecknoinits",
  "gochecksumtype",
  "gocognit",
  "goconst",
  "gocritic",
  "gocyclo",
  "godot",
  "godox",
  "gomoddirectives",
  "goprintffuncname",
  "gosec",
  "gosmopolitan",
  "govet",
  "grouper",
  "iface",
  "importas",
  "inamedparam",
  "ineffassign",
  "interfacebloat",
  "intrange",
  "ireturn",
  "lll",
  "loggercheck",
  "maintidx",
  "makezero",
  "mirror",
  "misspell",
  "mnd",
  "musttag",
  "nakedret",
  "nestif",
  "nilerr",
  "nilnil",
  "nlreturn",
  "noctx",
  "nolintlint",
  "nonamedreturns",
  "nosprintfhostport",
  "paralleltest",
  "perfsprint",
  "prealloc",
  "predeclared",
  "promlinter",
  "protogetter",
  "reassign",
  "revive",
  "rowserrcheck",
  "sloglint",
  "spancheck",
  "sqlclosecheck",
  "staticcheck",
  "tagalign",
  "tagliatelle",
  "testableexamples",
  "testifylint",
  "testpackage",
  "thelper",
  "tparallel",
  "unconvert",
  "unparam",
  "unused",
  "usestdlibvars",
  "usetesting",
  "wastedassign",
  "whitespace",
  "wrapcheck",
  "zerologlint",
]

[[linters.exclusions.rules]]
# Table-driven tests grow long cases and repeat literals without adding real complexity.
path = "_test\\.go"
linters = ["cyclop", "goconst"]

[[linters.exclusions.rules]]
# Cobra's own convention: each command registers itself and its flags in init().
path = "internal/cli/"
linters = ["gochecknoinits"]

[[linters.exclusions.rules]]
# GraphQL is camelCase by spec, unlike GitHub's snake_case REST API; these
# structs decode the wire response as-is, so the tags cannot be renamed.
path = "_graphql\\.go"
linters = ["tagliatelle"]

[[linters.exclusions.rules]]
# Every command here runs "git" with caller-supplied ref names as separate
# argv entries, never through a shell, so shell injection isn't possible;
# git itself rejects malformed ref names.
path = "internal/git/local\\.go"
linters = ["gosec"]

[[linters.exclusions.rules]]
# These test white-box unexported internals directly (mapReviewThreads,
# classifyError, filterByTime, GQLClient.doer, currentTestTransport,
# safetyTransport), so they cannot move to the external github_test package.
path = "internal/github/(actions_test|comments_test|transport_test|watch_graphql_test)\\.go"
linters = ["testpackage"]

[[linters.exclusions.rules]]
# Every command file's tests exercise private formatting/output helpers and
# run* functions directly (formatCommitAge, outputResult, runCleanup, ...);
# moving to cli_test would mean exporting CLI-internal implementation with no
# consumer beyond the tests.
path = "internal/cli/"
linters = ["testpackage"]

[linters.settings.cyclop]
max-complexity = 15

[linters.settings.dupl]
threshold = 100

[linters.settings.errcheck]
check-type-assertions = true
check-blank = true

[linters.settings.exhaustive]
default-signifies-exhaustive = true

[linters.settings.funlen]
lines = 100
statements = 50
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 20

[linters.settings.goconst]
min-len = 3
min-occurrences = 3

[linters.settings.gocritic]
enabled-tags = [
  "diagnostic",
  "style",
  "performance",
  "experimental",
  "opinionated",
]
disabled-checks = [
  "hugeParam",  # BubbleTea root Models are large by design; value receivers keep Update/View copy semantics
  "unnamedResult",  # contradicts nonamedreturns, which is enabled and wins
  "whyNoLint",
]

[linters.settings.gocyclo]
min-complexity = 15

[linters.settings.godot]
scope = "declarations"
capital = true

[linters.settings.gosec]
excludes = [
  # This is a local CLI the user runs themselves against files they already
  # have full access to: config paths, cache paths, and --output/--repos
  # arguments are never attacker-controlled the way G304 assumes.
  "G304",
  "G703",  # same taint-analysis rule as G304, newer rule ID
]

[linters.settings.govet]
enable-all = true
# fieldalignment reorders struct fields for tighter packing; disabled because
# reordering exported struct fields breaks the many positional struct literals
# in this codebase's table-driven tests, for a marginal memory win.
disable = ["shadow", "fieldalignment"]

[linters.settings.ireturn]
# Bubble Tea v2 moved to charm.land; both paths are listed so a project on either
# major version lints clean, because Model.Update returns the tea.Model interface
# and command functions return tea.Msg.
allow = [
  "error",
  "empty",
  "stdlib",
  "charm.land/bubbletea/v2.Model",
  "charm.land/bubbletea/v2.Msg",
  "github.com/charmbracelet/bubbletea.Model",
  "github.com/charmbracelet/bubbletea.Msg",
]

[linters.settings.lll]
line-length = 120
tab-width = 4

[linters.settings.misspell]
locale = "US"

[linters.settings.mnd]
ignored-functions = ["make", "strconv.*", "os.WriteFile", "os.MkdirAll", "os.OpenFile"]

[linters.settings.nakedret]
max-func-lines = 30

[linters.settings.nestif]
min-complexity = 5

[linters.settings.nlreturn]
block-size = 2

[linters.settings.nolintlint]
allow-unused = false
require-explanation = true
require-specific = true

[linters.settings.revive]
enable-all-rules = false
rules = [
  { name = "atomic" },
  { name = "blank-imports" },
  { name = "bool-literal-in-expr" },
  { name = "call-to-gc" },
  { name = "confusing-naming" },
  { name = "constant-logical-expr" },
  { name = "context-as-argument" },
  { name = "context-keys-type" },
  { name = "defer" },
  { name = "dot-imports" },
  { name = "early-return" },
  { name = "empty-block" },
  { name = "empty-lines" },
  { name = "error-naming" },
  { name = "error-return" },
  { name = "error-strings" },
  { name = "errorf" },
  { name = "exported" },
  { name = "if-return" },
  { name = "import-shadowing" },
  { name = "increment-decrement" },
  { name = "indent-error-flow" },
  { name = "modifies-parameter" },
  { name = "modifies-value-receiver" },
  { name = "package-comments" },
  { name = "range" },
  { name = "range-val-address" },
  { name = "range-val-in-closure" },
  { name = "receiver-naming" },
  { name = "redefines-builtin-id" },
  { name = "string-of-int" },
  { name = "struct-tag" },
  { name = "superfluous-else" },
  { name = "time-equal" },
  { name = "time-naming" },
  { name = "unexported-naming" },
  { name = "unexported-return" },
  { name = "unnecessary-stmt" },
  { name = "unreachable-code" },
  { name = "unused-parameter" },
  { name = "unused-receiver" },
  { name = "use-any" },
  { name = "useless-break" },
  { name = "var-declaration" },
  { name = "var-naming" },
  { name = "waitgroup-by-value" },
]

[linters.settings.staticcheck]
checks = ["all", "-ST1000"]

[linters.settings.tagliatelle]
case.rules.json = "snake"
# gh-sweep's config schema (.gh-sweep.yaml, .gh-sweep-policy.yaml) is
# snake_case throughout, documented and shipped in .gh-sweep.yaml.example;
# kebab-case is the template's default but would rename every existing key.
case.rules.yaml = "snake"

[linters.settings.testifylint]
enable-all = true

[linters.settings.unparam]
check-exported = true

[linters.settings.wrapcheck]
ignore-sigs = [
  ".Errorf(",
  "errors.New(",
  "errors.Unwrap(",
  "errors.Join(",
  ".Wrap(",
  ".Wrapf(",
  ".WithMessage(",
  ".WithMessagef(",
  ".WithStack(",
]

[run]
timeout = "5m"

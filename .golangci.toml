# Configuration file for golangci-lint
# For more options, see https://golangci-lint.run/usage/configuration/

version = 2

[formatters]
enable = [
  "gci",
  "gofmt",
  "gofumpt",
  "goimports"
]

[formatters.settings.gci]
sections = ["standard", "default", "prefix(github.com/KyleKing/gh-sweep)"]

[formatters.settings.gofumpt]
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ["github.com/KyleKing/gh-sweep"]

[linters]
disable = [
  "depguard", # requires allowlist/denylist configuration
  "forbidigo", # requires custom regex configuration
  "gochecknoglobals", # BubbleTea/lipgloss styles use package-level vars
  "goheader", # copyright headers add noise for personal projects
  "wsl" # whitespace linting too nitpicky
]
enable = [
  "asciicheck",
  "bidichk",
  "bodyclose",
  "containedctx",
  "contextcheck",
  "copyloopvar",
  "cyclop",
  "decorder",
  "dogsled",
  "dupl",
  "dupword",
  "durationcheck",
  "err113",
  "errcheck",
  "errchkjson",
  "errname",
  "errorlint",
  "exhaustive",
  "fatcontext",
  "forcetypeassert",
  "funlen",
  "ginkgolinter",
  "gocheckcompilerdirectives",
  "gochecknoinits",
  "gochecksumtype",
  "gocognit",
  "goconst",
  "gocritic",
  "gocyclo",
  "godot",
  "godox",
  "gomoddirectives",
  "gomodguard",
  "goprintffuncname",
  "gosec",
  "gosmopolitan",
  "govet",
  "grouper",
  "iface",
  "importas",
  "inamedparam",
  "ineffassign",
  "interfacebloat",
  "intrange",
  "ireturn", # see linters.settings.ireturn: bubbletea.Model allowed by design
  "lll",
  "loggercheck",
  "maintidx",
  "makezero",
  "mirror",
  "misspell",
  "mnd",
  "musttag",
  "nakedret",
  "nestif",
  "nilerr",
  "nilnil",
  "nlreturn",
  "noctx",
  "nolintlint",
  "nonamedreturns",
  "nosprintfhostport",
  "paralleltest",
  "perfsprint",
  "prealloc",
  "predeclared",
  "promlinter",
  "protogetter",
  "reassign",
  "revive",
  "rowserrcheck",
  "sloglint",
  "spancheck",
  "sqlclosecheck",
  "staticcheck",
  "tagalign",
  "tagliatelle",
  "testableexamples",
  "testifylint",
  "testpackage",
  "thelper",
  "tparallel",
  "unconvert",
  "unparam",
  "unused",
  "usestdlibvars",
  "usetesting",
  "wastedassign",
  "whitespace",
  "wrapcheck",
  "zerologlint"
]

# TODO(v1): remove after component refactor. The pre-lint codebase violates these
# style/complexity linters throughout; correctness linters (errcheck, unused,
# ineffassign, forcetypeassert, govet, staticcheck) stay enforced everywhere.
[[linters.exclusions.rules]]
path = "internal/(cache|cli|config|git|github|models|orphans|tui)/"
linters = [
  "containedctx",
  "cyclop",
  "dupl",
  "err113",
  "exhaustive",
  "funlen",
  "gochecknoinits",
  "gocognit",
  "goconst",
  "gocritic",
  "gocyclo",
  "godox",
  "gosec",
  "lll",
  "maintidx",
  "mnd",
  "musttag",
  "nestif",
  "nilnil",
  "nlreturn",
  "noctx",
  "nonamedreturns",
  "paralleltest",
  "prealloc",
  "revive",
  "tagliatelle",
  "testpackage",
  "thelper",
  "unparam",
  "wrapcheck"
]

[linters.settings.cyclop]
max-complexity = 15
skip-tests = true

[linters.settings.dupl]
threshold = 100

[linters.settings.errcheck]
check-type-assertions = true
check-blank = true

[linters.settings.exhaustive]
default-signifies-exhaustive = true

[linters.settings.funlen]
lines = 100
statements = 50
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 20

[linters.settings.goconst]
min-len = 3
min-occurrences = 3
ignore-tests = true

[linters.settings.gocritic]
enabled-tags = ["diagnostic", "style", "performance", "experimental", "opinionated"]
disabled-checks = ["whyNoLint"]

[linters.settings.gocyclo]
min-complexity = 15

[linters.settings.godot]
scope = "declarations"
capital = true

[linters.settings.gomodguard]
blocked.modules = []

[linters.settings.govet]
enable-all = true
# fieldalignment reorders struct fields for tighter packing; disabled because
# reordering exported struct fields breaks the many positional struct literals
# in this codebase's table-driven tests, for a marginal memory win.
disable = ["shadow", "fieldalignment"]

[linters.settings.ireturn]
# bubbletea's Elm architecture requires Update-family methods to return tea.Model
# and command functions to return tea.Msg
allow = ["error", "empty", "stdlib", "charm\\.land/bubbletea/v2\\.Model", "charm\\.land/bubbletea/v2\\.Msg"]

[linters.settings.lll]
line-length = 120
tab-width = 4

[linters.settings.misspell]
locale = "US"

[linters.settings.mnd]
ignored-functions = ["make", "strconv.*"]

[linters.settings.nakedret]
max-func-lines = 30

[linters.settings.nestif]
min-complexity = 5

[linters.settings.nlreturn]
block-size = 2

[linters.settings.nolintlint]
allow-unused = false
require-explanation = true
require-specific = true

[linters.settings.revive]
enable-all-rules = false
rules = [
  {name = "atomic"},
  {name = "blank-imports"},
  {name = "bool-literal-in-expr"},
  {name = "call-to-gc"},
  {name = "confusing-naming"},
  {name = "constant-logical-expr"},
  {name = "context-as-argument"},
  {name = "context-keys-type"},
  {name = "defer"},
  {name = "dot-imports"},
  {name = "early-return"},
  {name = "empty-block"},
  {name = "empty-lines"},
  {name = "error-naming"},
  {name = "error-return"},
  {name = "error-strings"},
  {name = "errorf"},
  {name = "exported"},
  {name = "if-return"},
  {name = "import-shadowing"},
  {name = "increment-decrement"},
  {name = "indent-error-flow"},
  {name = "modifies-parameter"},
  {name = "modifies-value-receiver"},
  {name = "package-comments"},
  {name = "range"},
  {name = "range-val-address"},
  {name = "range-val-in-closure"},
  {name = "receiver-naming"},
  {name = "redefines-builtin-id"},
  {name = "string-of-int"},
  {name = "struct-tag"},
  {name = "superfluous-else"},
  {name = "time-equal"},
  {name = "time-naming"},
  {name = "unexported-naming"},
  {name = "unexported-return"},
  {name = "unnecessary-stmt"},
  {name = "unreachable-code"},
  {name = "unused-parameter"},
  {name = "unused-receiver"},
  {name = "use-any"},
  {name = "useless-break"},
  {name = "var-declaration"},
  {name = "var-naming"},
  {name = "waitgroup-by-value"}
]

[linters.settings.staticcheck]
checks = ["all", "-ST1000"]

[linters.settings.tagliatelle]
case.rules.json = "snake"
case.rules.yaml = "kebab"

[linters.settings.testifylint]
enable-all = true

[linters.settings.unparam]
check-exported = true

[linters.settings.wrapcheck]
ignoreSigs = [
  ".Errorf(",
  "errors.New(",
  "errors.Unwrap(",
  "errors.Join(",
  ".Wrap(",
  ".Wrapf(",
  ".WithMessage(",
  ".WithMessagef(",
  ".WithStack("
]

[run]
timeout = "5m"
